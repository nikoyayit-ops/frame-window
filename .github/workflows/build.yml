name: Build Frame Window

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        id: build

      - name: Upload the .geode file
        uses: actions/upload-artifact@v4
        with:
          name: frame-window
          path: ${{ steps.build.outputs.build-output }}
